name: Windows MPC diagnostics
on:
  push:
    branches: [diagnostic/windows-mpc-limits-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Native MSVC MPC trace
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check out dependencies
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare pinned vcpkg registry
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Configure
        run: cmake --preset windows-msvc-vcpkg-static -DBUILD_MPC=ON -DLF_ENABLE_WLC=OFF -DWIRELINK_WLC_AUTO_DOWNLOAD=OFF
      - name: Build diagnostic test
        run: cmake --build --preset windows-static-release --target test_mpc_session --parallel
      - name: Run until first failure
        run: ctest --preset windows-static-release -R "^mpc_session$" -V --repeat until-fail:8
