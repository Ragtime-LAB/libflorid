name: Host CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Sanitizer (io_uring ${{ matrix.io_uring }}, WLC ${{ matrix.wlc }}, MPC ${{ matrix.mpc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - io_uring: 'ON'
            wlc: 'ON'
            mpc: 'OFF'
          - io_uring: 'OFF'
            wlc: 'OFF'
            mpc: 'OFF'
          - io_uring: 'OFF'
            wlc: 'OFF'
            mpc: 'ON'
    steps:
      - name: Check out libflorid
        uses: actions/checkout@v5

      - name: Check out required submodules
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink

      - name: Check vendored MPC runtime integrity and size
        if: matrix.mpc == 'ON'
        run: python3 scripts/vendor_acados.py --check

      - name: Check out paired WLC 0.5.0 / ABI 30 compiler
        if: matrix.wlc == 'ON'
        uses: actions/checkout@v5
        with:
          repository: starwey604/wlc
          ref: 120b9af130753d2ba0d137882916bfe207d3d312
          path: .tools/wlc

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev liburing-dev clang ninja-build python3-numpy

      - name: Check generated MPC adapters
        if: matrix.mpc == 'ON'
        run: |
          /usr/bin/python3 scripts/urdf2mpc.py --wrappers-only --outdir build/mpc-adapters
          diff -u generated/WillowMPCTraits.hpp build/mpc-adapters/WillowMPCTraits.hpp
          diff -u generated/c_generated_code/acados_solver_willow_mpc.h build/mpc-adapters/c_generated_code/acados_solver_willow_mpc.h
          diff -u generated/c_generated_code/acados_solver_willow_mpc.c build/mpc-adapters/c_generated_code/acados_solver_willow_mpc.c

      - name: Build paired compiler
        if: matrix.wlc == 'ON'
        run: cargo build --release --locked --manifest-path .tools/wlc/Cargo.toml

      - name: Configure
        run: >-
          cmake -S . -B build/host-sanitize -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON
          -DASTRIAL_IO_URING=${{ matrix.io_uring }}
          -DBUILD_MPC=${{ matrix.mpc }} -DBUILD_SHARED_LIBS=OFF
          -DBLASFEO_TARGET=GENERIC -DHPIPM_TARGET=GENERIC
          -DLF_ENABLE_WLC=${{ matrix.wlc }}
          -DWLC_EXECUTABLE="${{ github.workspace }}/.tools/wlc/target/release/wlc"
          -DWIRELINK_WLC_AUTO_DOWNLOAD=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -O1"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -O1"

      - name: Build and test
        env:
          UBSAN_OPTIONS: ${{ matrix.mpc == 'ON' && 'halt_on_error=1:print_stacktrace=1' || '' }}
        run: |
          cmake --build build/host-sanitize --parallel 2
          ctest --test-dir build/host-sanitize --output-on-failure

      - name: Check committed bindings against WLC
        if: matrix.wlc == 'ON'
        run: cmake --build build/host-sanitize --target lf_check_wirelink

  windows:
    name: Windows MSVC (${{ matrix.linkage }}, MPC ${{ matrix.mpc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: dynamic
            mpc: 'OFF'
            configure_preset: windows-msvc-vcpkg
            release_preset: windows-release
            debug_preset: windows-debug
          - linkage: static
            mpc: 'OFF'
            configure_preset: windows-msvc-vcpkg-static
            release_preset: windows-static-release
            debug_preset: windows-static-debug
          - linkage: static
            mpc: 'ON'
            configure_preset: windows-msvc-vcpkg-static
            release_preset: windows-static-release
            debug_preset: windows-static-debug

    steps:
      - name: Check out libflorid
        uses: actions/checkout@v5

      - name: Check out required submodules
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink

      - name: Set up MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare pinned vcpkg registry
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.configure_preset }}
          -DBUILD_MPC=${{ matrix.mpc }}
          -DLF_ENABLE_WLC=OFF -DWLC_EXECUTABLE=C:/wlc-must-not-run.exe
          -DWIRELINK_WLC_AUTO_DOWNLOAD=OFF

      - name: Build and test Release
        run: |
          cmake --build --preset ${{ matrix.release_preset }} --parallel
          ctest --preset ${{ matrix.release_preset }}

      - name: Build and test Debug
        run: |
          cmake --build --preset ${{ matrix.debug_preset }} --parallel
          ctest --preset ${{ matrix.debug_preset }}

      - name: Verify dynamic app-local deployment
        if: matrix.linkage == 'dynamic'
        shell: pwsh
        run: |
          $dlls = Get-ChildItem build/windows-msvc-vcpkg `
            -Filter libusb-1.0.dll -Recurse |
            Where-Object FullName -NotMatch 'vcpkg_installed'
          if (-not ($dlls.FullName -match '\\Release\\')) {
            throw 'Release libusb-1.0.dll was not deployed app-local'
          }
          if (-not ($dlls.FullName -match '\\Debug\\')) {
            throw 'Debug libusb-1.0.dll was not deployed app-local'
          }

      - name: Verify static build has no app-local libusb DLL
        if: matrix.linkage == 'static'
        shell: pwsh
        run: |
          $dlls = Get-ChildItem build/windows-msvc-vcpkg-static `
            -Filter libusb-1.0.dll -Recurse |
            Where-Object FullName -NotMatch 'vcpkg_installed'
          if ($dlls) {
            throw "Static build unexpectedly deployed: $($dlls.FullName)"
          }
