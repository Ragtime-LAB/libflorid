name: Windows MPC transition validation
on:
  push:
    branches: [diagnostic/windows-mpc-transition-fix-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Native MSVC MPC ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            preset: windows-static-release
          - config: Debug
            preset: windows-static-debug
    steps:
      - uses: actions/checkout@v5
      - name: Check out dependencies
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare pinned vcpkg registry
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Configure
        run: cmake --preset windows-msvc-vcpkg-static -DBUILD_MPC=ON -DLF_ENABLE_WLC=OFF -DWIRELINK_WLC_AUTO_DOWNLOAD=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -V
      - name: Repeat MPC session
        if: matrix.config == 'Release'
        run: ctest --preset ${{ matrix.preset }} -R "^mpc_session$" -V --repeat until-fail:12
