name: Build Wheels

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out binding dependencies
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows USB dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          vcpkg install --triplet x64-windows-static-md
          --x-install-root=C:/vcpkg/installed

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.0
        env:
          # Linux native dependencies are installed inside the container.
          # Link libusb statically but keep the dynamic CRT used by CPython.
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
            -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
            -DLF_ENABLE_WLC=OFF -DWIRELINK_WLC_AUTO_DOWNLOAD=OFF"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out binding dependencies
        run: git submodule update --init protocol 3rdparty/astrial 3rdparty/wirelink

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Install sdist consumer tools
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev ninja-build

      - name: Build and import from unpacked sdist
        run: python scripts/ci/check-sdist.py dist/*.tar.gz --work-dir build/sdist-consumer

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
