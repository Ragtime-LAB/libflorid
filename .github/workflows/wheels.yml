name: Build Wheels

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Recursive checkout so protocol/ and 3rdparty/astrial/ (needed by
          # the bindings) are populated. acados is pruned below.
          submodules: recursive

      - name: Prune acados (not needed for bindings)
        shell: bash
        run: rm -rf 3rdparty/acados

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows USB dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          vcpkg install --triplet x64-windows-static
          --x-install-root=C:/vcpkg/installed

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.0
        env:
          # cibuildwheel >= 3.x builds CPython 3.14 by default.
          # Skip free-threaded variants (cp313t/cp314t) unless the
          # pybind11 extension is explicitly free-threading ready.
          CIBW_SKIP: "cp31?t-*"
          # manylinux builds run in a container, so the host package state is
          # not visible. Install libusb in that container before CMake runs.
          CIBW_BEFORE_ALL_LINUX: "dnf install -y libusb1-devel"
          # Keep the Windows wheel self-contained: link libusb statically and
          # expose the runner's vcpkg installation to scikit-build-core.
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
            -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prune acados (not needed for bindings)
        shell: bash
        run: rm -rf 3rdparty/acados

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
